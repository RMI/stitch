[project]
name = "stitch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "deployments/api",
  "deployments/entity-linkage",
  "deployments/stitch-llm",
  "packages/stitch-auth",
  "packages/stitch-client",
  "packages/stitch-models",
  "packages/stitch-observability",
  "packages/stitch-ogsi",
]

[tool.uv.sources]
stitch-auth = { workspace = true }
stitch-client = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0"]

[tool.ruff.lint]
# Ruff 0.16.0 expanded the default rule set from 59 to 413 rules. Pin the
# pre-0.16 default selection here so this dependency bump preserves existing
# lint behavior. Adopting the new defaults is tracked separately.
select = ["E4", "E7", "E9", "F"]
