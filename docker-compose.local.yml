services:

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    profiles: ["tools", "full", "alembic-generate"]
    depends_on:
      db:
        condition: service_healthy

  alembic-generate:
    build:
      context: .
      dockerfile: deployments/api/Dockerfile
      args:
        APP_VERSION: ${API_APP_VERSION:-0.1.0}
        BUILD_ID: ${API_BUILD_ID:-docker-local}
        GIT_SHA: ${API_GIT_SHA:-unknown}
        BUILD_TIME: ${API_BUILD_TIME:-unknown}
    read_only: true
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${DBINIT_LOG_LEVEL:-info}
      # Alembic migrator connects as the DDL role.
      POSTGRES_USER: stitch_migrator
      POSTGRES_PASSWORD: ${STITCH_MIGRATOR_PASSWORD:?STITCH_MIGRATOR_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    volumes:
      - ./deployments/api/alembic/versions:/app/deployments/api/alembic/versions:rw
    command: ["alembic", "-c", "deployments/api/alembic.ini", "revision", "--autogenerate", "-m", "baseline"]
    # On-demand only (via `make alembic-autogenerate`). Must NOT be in the
    # `tools`/`full` profiles, or it autogenerates a blank revision on every
    # `make api-dev` / `make reboot-docker` startup.
    profiles: ["alembic-generate"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: deployments/seed/Dockerfile
    env_file:
      - .env
    environment:
      # Inside compose network, talk to the api service by name.
      API_BASE_URL: ${SEED_API_BASE_URL:-http://api:8000/api/v1}
      # No STITCH_AUTH_* / bearer here: local runs the api with AUTH_DISABLED=true,
      # so the client attaches no Authorization header (no Auth0 needed).
      FAKER_POST_COUNT: ${SEED_FAKER_POST_COUNT:-5}
      LOG_LEVEL: ${SEED_LOG_LEVEL:-INFO}
      RANDOM_SEED: 8675309
      SEED_SOURCE: "mixed"
      NULL_PROBABILITY: 0.3
      STATIC_PAYLOAD_DIR: "/mnt/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deployments/seed/data:/mnt/data:ro
    restart: "no"
    profiles: ["seed", "full"]

  entity-linkage:
    build:
      context: .
      dockerfile: deployments/entity-linkage/Dockerfile
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${ENTITY_LINKAGE_LOG_LEVEL:-info}
      ENTITY_LINKAGE_API_BASE_URL: ${ENTITY_LINKAGE_API_BASE_URL:-http://api:8000/api/v1}
      # No STITCH_AUTH_* here: local runs the api with AUTH_DISABLED=true, so the
      # client attaches no Authorization header (no Auth0 needed).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["entity-linkage", "full", "friends"]

  stitch-llm:
    build:
      context: .
      dockerfile: deployments/stitch-llm/Dockerfile
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${STITCH_LLM_LOG_LEVEL:-info}
      # No STITCH_AUTH_* here: local runs the api with AUTH_DISABLED=true, so the
      # client attaches no Authorization header (no Auth0 needed).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["stitch-llm", "full", "friends"]
