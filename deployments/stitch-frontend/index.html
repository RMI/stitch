<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stitch</title>
  </head>
  <body>
    <div id="root">
      <div class="bootstrap-shell" role="status" aria-live="polite">
        <div class="bootstrap-shell__spinner" aria-hidden="true"></div>
        <p class="bootstrap-shell__label">Loading Stitch...</p>
      </div>
    </div>
    <style>
      .bootstrap-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #475569;
        background: #fff;
      }

      .bootstrap-shell__spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid #e2e8f0;
        border-top-color: #475569;
        border-radius: 9999px;
        animation: bootstrap-spin 0.8s linear infinite;
      }

      .bootstrap-shell__label {
        margin: 0;
        font-size: 0.875rem;
      }

      @keyframes bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
