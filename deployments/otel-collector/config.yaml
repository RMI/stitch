# OpenTelemetry Collector config for local dev.
#
# Receives OTLP from the API, batches, and forwards to the Jaeger all-in-one
# container (which exposes an OTLP receiver of its own). The `debug` exporter
# also dumps a summary to the collector's stdout, handy when traces aren't
# showing up in Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
