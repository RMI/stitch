---
identity:
  type: UserAssigned
  userAssignedIdentities:
    "${LANE_BACKUP_IDENTITY_ID}": {}
properties:
  environmentId: "${LANE_ENVIRONMENT_ID}"
  configuration:
    triggerType: Schedule
    replicaTimeout: 1800
    replicaRetryLimit: 0
    scheduleTriggerConfig:
      cronExpression: "0 3 * * *"
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: pgpassword
        value: ${LANE_PGPASSWORD_JSON}
  template:
    volumes:
      - name: scratch
        storageType: EmptyDir
    initContainers:
      - name: dump
        image: postgres:17-alpine
        resources: { cpu: 0.5, memory: 1.0Gi }
        volumeMounts:
          - { volumeName: scratch, mountPath: /scratch }
        env:
          - { name: PGHOST, value: "${LANE_PGHOST}" }
          - { name: PGUSER, value: "${LANE_PGUSER}" }
          - { name: PGSSLMODE, value: require }
          - { name: BACKUP_DATABASES, value: "${LANE_BACKUP_DATABASES}" }
          - { name: PGPASSWORD, secretRef: pgpassword }
        command: ["/bin/sh", "-c"]
        args:
          - 'set -e; for db in $BACKUP_DATABASES; do pg_dump -Fc -d "$db" -f "/scratch/$db.dump"; done'
    containers:
      - name: upload
        image: mcr.microsoft.com/azure-cli
        resources: { cpu: 0.5, memory: 1.0Gi }
        volumeMounts:
          - { volumeName: scratch, mountPath: /scratch }
        env:
          - { name: BACKUP_ENV, value: "${LANE_BACKUP_ENV}" }
          - { name: BACKUP_DATABASES, value: "${LANE_BACKUP_DATABASES}" }
          - { name: ACCOUNT, value: "${LANE_STORAGE_ACCOUNT}" }
        command: ["/bin/sh", "-c"]
        args:
          - 'set -e; az login --identity --client-id ${LANE_BACKUP_IDENTITY_CLIENT_ID} -o none; ts=$(date -u +%Y%m%dT%H%M%SZ); for db in $BACKUP_DATABASES; do az storage blob upload --account-name "$ACCOUNT" --auth-mode login -c backups -n "$BACKUP_ENV/$db/$ts.dump" -f "/scratch/$db.dump" -o none; done'
