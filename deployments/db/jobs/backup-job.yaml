---
location: "${LANE_LOCATION}"
identity:
  type: UserAssigned
  userAssignedIdentities:
    "${LANE_BACKUP_IDENTITY_ID}": {}
properties:
  environmentId: "${LANE_ENVIRONMENT_ID}"
  configuration:
    triggerType: Schedule
    replicaTimeout: 1800
    replicaRetryLimit: 0
    scheduleTriggerConfig:
      cronExpression: "0 3 * * *"
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: pgpassword
        value: ${LANE_PGPASSWORD_JSON}
  template:
    volumes:
      - name: scratch
        storageType: EmptyDir
    initContainers:
      - name: dump
        image: postgres:17-alpine
        resources: { cpu: 0.5, memory: 1.0Gi }
        volumeMounts:
          - { volumeName: scratch, mountPath: /scratch }
        env:
          - { name: PGHOST, value: "${LANE_PGHOST}" }
          - { name: PGUSER, value: "${LANE_PGUSER}" }
          - { name: PGSSLMODE, value: require }
          - { name: BACKUP_DATABASES, value: "${LANE_BACKUP_DATABASES}" }
          - { name: PGPASSWORD, secretRef: pgpassword }
        command: ["/bin/sh", "-c"]
        args:
          # A failed dump must not stop the other databases. Record the failure in
          # /scratch/FAILED and exit 0; the upload container reports it at the end.
          - |
            for db in $BACKUP_DATABASES; do
              if ! pg_dump -Fc -d "$db" -f "/scratch/$db.dump"; then
                echo "pg_dump failed for $db" >&2
                rm -f "/scratch/$db.dump"
                echo "$db" >> /scratch/FAILED
              fi
            done
    containers:
      - name: upload
        image: mcr.microsoft.com/azure-cli
        resources: { cpu: 0.5, memory: 1.0Gi }
        volumeMounts:
          - { volumeName: scratch, mountPath: /scratch }
        env:
          - { name: BACKUP_ENV, value: "${LANE_BACKUP_ENV}" }
          - { name: BACKUP_DATABASES, value: "${LANE_BACKUP_DATABASES}" }
          - { name: ACCOUNT, value: "${LANE_STORAGE_ACCOUNT}" }
          - { name: BACKUP_IDENTITY_CLIENT_ID, value: "${LANE_BACKUP_IDENTITY_CLIENT_ID}" }
        command: ["/bin/sh", "-c"]
        args:
          # Sign in as the job's user-assigned managed identity (it holds Storage
          # Blob Data Contributor on the backups container only). Managed identity
          # is only available to main containers, so the upload cannot move into
          # the init container.
          #
          # Upload every dump that exists, then fail the execution if any dump or
          # upload failed so a partial backup still shows up as a failed run.
          - |
            if ! az login --identity --client-id "$BACKUP_IDENTITY_CLIENT_ID" --allow-no-subscriptions --output none; then
              echo "az login with the backup managed identity failed" >&2
              exit 1
            fi
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            failed=0
            for db in $BACKUP_DATABASES; do
              [ -f "/scratch/$db.dump" ] || continue
              if ! az storage blob upload --account-name "$ACCOUNT" --auth-mode login -c backups -n "$BACKUP_ENV/$db/$ts.dump" -f "/scratch/$db.dump" -o none; then
                echo "upload failed for $db" >&2
                failed=1
              fi
            done
            if [ -s /scratch/FAILED ]; then
              echo "dump failed for: $(tr '\n' ' ' </scratch/FAILED)" >&2
              failed=1
            fi
            exit "$failed"
