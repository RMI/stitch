[project]
name = "stitch-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Michael Barlow", email = "mbarlow@rmi.org" }]
requires-python = ">=3.12.12"
dependencies = [
  "alembic>=1.17.1",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.139.2",
  "greenlet>=3.3.0",
  "psycopg[binary]>=3.3.4",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.44",
  "stitch-auth",
  "stitch-models",
  "stitch-ogsi",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stitch.api"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-anyio>=0.0.0",
  "aiosqlite>=0.21.0",
  "httpx>=0.28.0",
  "polyfactory>=3.3.0",
  # Test-only: the M2M end-to-end test drives the real client auth
  # (Auth0M2MAuth / fetch_auth_jwt) against the ASGI app.
  "stitch-client",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.uv.sources]
stitch-auth = { workspace = true }
stitch-client = { workspace = true }
stitch-models = { workspace = true }
stitch-ogsi = { workspace = true }
