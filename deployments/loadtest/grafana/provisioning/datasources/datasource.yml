# Grafana datasource provisioning for the LOCAL stack. `isDefault: true` is what
# matters: the committed dashboards select their Prometheus source via a
# `datasource` template variable (not a hardcoded UID), and that variable
# auto-picks the default Prometheus datasource — so the same dashboard JSON
# renders here and in Azure Managed Grafana without any UID matching.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: stitch-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
