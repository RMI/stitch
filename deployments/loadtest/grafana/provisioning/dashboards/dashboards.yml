# Loads the committed dashboard JSON into the local Grafana at startup.
apiVersion: 1

providers:
  - name: stitch
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
