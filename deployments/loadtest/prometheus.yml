# Minimal Prometheus config for local load testing.
#
# k6 pushes its metrics in via the remote-write receiver (enabled on the
# command line with --web.enable-remote-write-receiver), so there is nothing to
# scrape here beyond Prometheus's own metrics.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # RED metrics the OTel collector derives from the API's spans (spanmetrics
  # connector). Present whenever the collector is up (full profile). If it's
  # down this target just shows as down — harmless.
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
