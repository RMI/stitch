[project]
name = "stitch-observability"
version = "0.1.0"
description = "Shared OpenTelemetry tracing setup + instrumentation for Stitch services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  # >=0.65b0: pre-0.65 opentelemetry-instrumentation-fastapi crashed on a
  # partial route match (CORS preflight) under FastAPI >=0.137, reading `.path`
  # on an `_IncludedRouter` node and 500-ing the request before CORS could
  # attach its headers (surfaced in the browser as "Failed to fetch"). The whole
  # instrumentation set is kept aligned since these packages release in lockstep.
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
# The `middleware` submodule is Starlette middleware (BaseHTTPMiddleware +
# routing.Match), so it needs Starlette at import time. It's an optional extra
# rather than a hard dependency so the tracing/logging core stays framework-free;
# a consumer that uses RequestContextMiddleware installs stitch-observability[asgi].
asgi = ["starlette>=0.40"]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stitch.observability"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[dependency-groups]
# fastapi + httpx are test-only. fastapi also pulls in Starlette (the `asgi`
# extra's dependency), so the middleware tests exercise the real import path
# without the suite needing to install the extra explicitly.
dev = ["pytest>=9.0.2", "fastapi[standard-no-fastapi-cloud-cli]>=0.140.7", "httpx>=0.28.0"]
