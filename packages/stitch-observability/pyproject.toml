[project]
name = "stitch-observability"
version = "0.1.0"
description = "Shared OpenTelemetry tracing setup + instrumentation for Stitch services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "pydantic-settings>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stitch.observability"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[dependency-groups]
# fastapi + httpx are test-only: RequestContextMiddleware is Starlette
# middleware (in the `middleware` submodule, kept out of the top-level package
# import so tracing/logging stay framework-free), exercised via TestClient.
dev = ["pytest>=9.0.2", "fastapi[standard-no-fastapi-cloud-cli]>=0.135.1", "httpx>=0.28.0"]
