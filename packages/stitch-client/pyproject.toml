[project]
name = "stitch-client"
version = "0.1.0"
description = "Shared async Stitch API client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.0", "stitch-ogsi"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stitch.client"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
]

[tool.uv.sources]
stitch-ogsi = { workspace = true }
