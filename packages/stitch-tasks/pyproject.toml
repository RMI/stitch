[project]
name = "stitch-tasks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Barlow", email = "mbarlow@rmi.org" }
]
requires-python = ">=3.12"
dependencies = [
    "griffelib[faster]>=2.4.1",
    "jinja2>=3.1.6",
