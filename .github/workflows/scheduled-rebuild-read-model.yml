---
# Every 6 hours, rebuild the API's resource-state read model for the long-lived
# `main` and `production` deployments. The write paths keep the rows current;
# this repairs drift they can't see (manual SQL, a database restore). A rebuild
# also runs after every deploy (build-and-deploy.yml).
#
# Each run rebuilds the deployment named by its branch: `main` or `production`.
# Scheduled runs always come from `main`, and the `production` GitHub
# Environment only accepts deployments from the `production` branch, so the
# scheduled run also starts this workflow on `production` (which works once a
# release has carried this file there). It can also be run by hand on either
# branch from the Actions tab.
#
# Uses the image tag each deploy pushes (`stitch-api:<deployment-name>`). If a
# deploy pushed its image and then failed, that tag is ahead of the running
# code until the next successful deploy.
#
# See deployments/api/READ_MODEL.md.
name: Scheduled Read Model Rebuild

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  rebuild-read-model:
    name: "Rebuild Read Model (${{ github.ref_name }})"
    if: github.ref_name == 'main' || github.ref_name == 'production'
    # One at a time per deployment; never cancel a rebuild partway.
    concurrency:
      group: scheduled-rebuild-read-model-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/rebuild-read-model.yml
    secrets:
      stitch-app-password: ${{ secrets.STITCH_APP_PASSWORD }}
    with:
      # Lanes and deployment names as in resolve-deployment-context.yml.
      deployment-lane: ${{ github.ref_name == 'production' && 'production' || 'development' }}
      full-image-name: ghcr.io/rmi/stitch-api:${{ github.ref_name }}
      # Each deployment's database is named after it (see deploy-db.yml).
      postgres-db: ${{ github.ref_name }}

  start-production-rebuild:
    name: "Start the production rebuild"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A run started with the workflow's own token is allowed to trigger
      # workflow_dispatch (unlike most events).
      - name: Run this workflow on the production branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run scheduled-rebuild-read-model.yml --ref production
