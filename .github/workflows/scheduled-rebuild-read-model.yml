---
# Every 6 hours, rebuild the API's resource-state read model for each
# long-lived deployment. The write paths keep the rows current; this repairs
# drift they can't see (manual SQL, a database restore). A rebuild also runs
# after every deploy (build-and-deploy.yml).
#
# Uses the image tag each deploy pushes (`stitch-api:<deployment-name>`). If a
# deploy pushed its image and then failed, that tag is ahead of the running
# code until the next successful deploy.
#
# See deployments/api/READ_MODEL.md.
name: Scheduled Read Model Rebuild

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  rebuild-read-model:
    name: "Rebuild Read Model (${{ matrix.deployment-name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment-lane: development
            deployment-name: main
          - deployment-lane: production
            deployment-name: production
    # One at a time per deployment; never cancel a rebuild partway.
    concurrency:
      group: scheduled-rebuild-read-model-${{ matrix.deployment-name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/rebuild-read-model.yml
    secrets:
      stitch-app-password: ${{ secrets.STITCH_APP_PASSWORD }}
    with:
      deployment-lane: ${{ matrix.deployment-lane }}
      full-image-name: ghcr.io/rmi/stitch-api:${{ matrix.deployment-name }}
      # Each deployment's database is named after it (see deploy-db.yml).
      postgres-db: ${{ matrix.deployment-name }}
