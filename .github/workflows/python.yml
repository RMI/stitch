---
on:
  pull_request:
    branches:
      - main
      - next
      - production
  push:
    branches:
      - main
      - production

name: Python Package Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests"
    uses: ./.github/workflows/python-test.yml

  lint:
    name: "Linting"
    uses: ./.github/workflows/python-lint.yml

  lock-check:
    name: "Check Lockfile"
    uses: ./.github/workflows/python-lock-check.yml

  format:
    name: "Format"
    uses: ./.github/workflows/python-format.yml

  build:
    name: "Build"
    uses: ./.github/workflows/python-build.yml
