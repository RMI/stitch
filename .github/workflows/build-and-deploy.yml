name: CD Pipeline

on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  resolve-context:
    uses: ./.github/workflows/resolve-deployment-context.yml
    secrets: inherit

  lane-config:
    name: Resolve lane config
    needs: [resolve-context]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    outputs:
      frontend_origin_url: ${{ steps.compute.outputs.frontend_origin_url }}
    env:
      FRONTEND_PRODUCTION_URL: ${{ vars.FRONTEND_PRODUCTION_URL }}
      FRONTEND_PREVIEW_URL_TEMPLATE: ${{ vars.FRONTEND_PREVIEW_URL_TEMPLATE }}
    steps:
      - name: Validate frontend lane variables
        shell: bash
        run: |
          set -euo pipefail
          : "${FRONTEND_PRODUCTION_URL:?Missing required variable FRONTEND_PRODUCTION_URL}"
          : "${FRONTEND_PREVIEW_URL_TEMPLATE:?Missing required variable FRONTEND_PREVIEW_URL_TEMPLATE}"

      - name: Compute frontend origin
        id: compute
        shell: bash
        env:
          TARGET_NAME: ${{ needs.resolve-context.outputs.deployment-name }}
          DEPLOYMENT_LANE: ${{ needs.resolve-context.outputs.deployment-lane }}
        run: |
          set -euo pipefail

          if [ "${DEPLOYMENT_LANE}" = "dress-rehearsal" ]; then
            frontend_origin_url="${FRONTEND_PRODUCTION_URL}"
          else
            frontend_origin_url="${FRONTEND_PREVIEW_URL_TEMPLATE//\{name\}/${TARGET_NAME}}"
          fi

          echo "frontend_origin_url=$frontend_origin_url" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: "Build frontend"
    needs: [resolve-context]
    uses: ./.github/workflows/node-build.yml
    secrets: inherit

  build_api_docker_image:
    name: "Build and publish API"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/api/Dockerfile
      image-name: ${{ github.event.repository.name }}-api
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  build_entity_linkage_docker_image:
    name: "Build and publish Entity Linkage"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/entity-linkage/Dockerfile
      image-name: ${{ github.event.repository.name }}-entity-linkage
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  build_stitch_llm_docker_image:
    name: "Build and publish Stitch LLM"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/stitch-llm/Dockerfile
      image-name: ${{ github.event.repository.name }}-stitch-llm
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  build_seed_docker_image:
    name: "Build and publish Seed"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/seed/Dockerfile
      image-name: ${{ github.event.repository.name }}-seed
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  deploy-db:
    name: "Create DB"
    needs: [resolve-context]
    uses: ./.github/workflows/deploy-db.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      deployment-name: ${{ needs.resolve-context.outputs.deployment-name }}

  run-db-init:
    name: "Run DB init"
    needs: [resolve-context, build_api_docker_image, deploy-db]
    uses: ./.github/workflows/run-db-init.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build_api_docker_image.outputs.digest-image-name }}
      postgres-host: ${{ needs.deploy-db.outputs.postgres-host }}
      postgres-port: ${{ needs.deploy-db.outputs.postgres-port }}
      postgres-db: ${{ needs.deploy-db.outputs.postgres-db }}
      postgres-sslmode: ${{ needs.deploy-db.outputs.postgres-sslmode }}

  deploy-api:
    name: "Deploy API"
    needs: [resolve-context, lane-config, build_api_docker_image, deploy-db, run-db-init]
    uses: ./.github/workflows/deploy-container.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build_api_docker_image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-api', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        LOG_LEVEL=debug
        FRONTEND_ORIGIN_URL=${{ needs.lane-config.outputs.frontend_origin_url }}
        AUTH_DISABLED=true
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        ENVIRONMENT=${{ needs.resolve-context.outputs.deployment-name }}
        POSTGRES_HOST=${{ needs.deploy-db.outputs.postgres-host }}
        POSTGRES_PORT=${{ needs.deploy-db.outputs.postgres-port }}
        POSTGRES_DB=${{ needs.deploy-db.outputs.postgres-db }}
        POSTGRES_USER=${{ needs.deploy-db.outputs.postgres-user }}
        POSTGRES_PASSWORD=${{ secrets.STITCH_APP_PASSWORD }}
        PGSSLMODE=${{ needs.deploy-db.outputs.postgres-sslmode }}
      deployment-label: api

  deploy-entity-linkage:
    name: "Deploy entity linkage"
    needs: [resolve-context, lane-config, build_entity_linkage_docker_image, deploy-api]
    uses: ./.github/workflows/deploy-container.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build_entity_linkage_docker_image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-entity-linkage', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        LOG_LEVEL=info
        AUTH_DISABLED=true
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        STITCH_CLIENT_BEARER_TOKEN=dev-placeholder-token
        ENTITY_LINKAGE_API_BASE_URL=${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
        ENTITY_LINKAGE_FRONTEND_ORIGIN_URL=${{ needs.lane-config.outputs.frontend_origin_url }}
      deployment-label: entity-linkage

  deploy-stitch-llm:
    name: "Deploy stitch-llm"
    needs: [resolve-context, lane-config, build_stitch_llm_docker_image, deploy-api]
    uses: ./.github/workflows/deploy-container.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build_stitch_llm_docker_image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-stitch-llm', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        STITCH_LLM_LOG_LEVEL=info
        AUTH_DISABLED=true
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        STITCH_CLIENT_BEARER_TOKEN=dev-placeholder-token
        STITCH_LLM_API_BASE_URL=${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
        STITCH_LLM_FRONTEND_ORIGIN_URL=${{ needs.lane-config.outputs.frontend_origin_url }}
      deployment-label: stitch-llm

  run-seed:
    name: "Run seed"
    if: ${{ needs.deploy-db.outputs.database-created == 'true' }}
    needs: [resolve-context, build_seed_docker_image, deploy-db, deploy-api]
    uses: ./.github/workflows/run-seed.yml
    secrets: inherit
    with:
      full-image-name: ${{ needs.build_seed_docker_image.outputs.digest-image-name }}
      api-url: ${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}

  deploy-frontend:
    name: "Deploy frontend"
    needs: [resolve-context, build-frontend, deploy-api, deploy-entity-linkage, deploy-stitch-llm]
    uses: ./.github/workflows/azure-static-web-apps.yml
    secrets: inherit
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      artifact-name: dist-tgz
      deployment-name: ${{ needs.resolve-context.outputs.deployment-name }}
      api-url: ${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
      entity-linkage-url: ${{ format('{0}/api/v1', needs.deploy-entity-linkage.outputs.container-app-url) }}
      stitch-llm-url: ${{ format('{0}/api/v1', needs.deploy-stitch-llm.outputs.container-app-url) }}
      auth0-domain: rmi-spd.us.auth0.com
      auth0-client-id: TS1V1soQbccAV1sitFFCfUaIlSwHD2S2
      auth0-audience: https://stitch-api.local
      production-branch: production

  comment-summary:
    if: ${{ always() && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/comment-pr-summary.yml
    secrets: inherit
    needs: [resolve-context, build-api-docker-image, build-entity-linkage-docker-image, build-stitch-llm-docker-image, build-seed-docker-image, deploy-db, run-db-init, deploy-api, deploy-entity-linkage, deploy-stitch-llm, run-seed, deploy-frontend]
