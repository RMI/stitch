name: CD Pipeline

on:
  pull_request:
    # labeled/unlabeled are included so toggling the 'no-deploy' label (see the
    # resolve-context guard) takes effect immediately instead of waiting for the
    # next push. The default types must be listed explicitly once any are named.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  # This pipeline deploys per-PR preview environments and needs repository
  # secrets, which the pull_request event withholds from two kinds of PR: PRs
  # opened from a fork (secrets never flow to forks) and bot-authored PRs
  # (Dependabot in particular always runs without secrets, and other bots can't
  # be reliably told apart from it). Gate on both so those PRs skip the pipeline
  # instead of failing: require the PR to originate from this repo (not a fork)
  # and to be authored by a human -- user.type == 'User' excludes every bot,
  # current or future, with no denylist to maintain.
  #
  # NB: author_association is deliberately NOT used. It reports MEMBER only for
  # *public* org members, so our private-membership humans surface as
  # CONTRIBUTOR -- indistinguishable from Dependabot -- which silently skips
  # every internal PR.
  #
  # Future option: to let a human opt a specific bot PR into deploying, add a
  # label trigger (on.pull_request.types: [..., labeled]) and OR a label check
  # into these guards, e.g.
  # contains(github.event.pull_request.labels.*.name, 'deploy-preview').
  # (Dependabot PRs still receive no secrets even when labeled; those need a
  # human to re-push the branch under their own PR.)
  #
  # A PR labeled 'no-deploy' opts out of the build/deploy pipeline entirely: the
  # guard fails, resolve-context is skipped, and the rest of the pipeline skips
  # with it. The language-level checks (Node / Python workflows) are separate and
  # still run. Toggling the label re-runs this workflow (see on.pull_request.types
  # above), so removing it re-enables deploys without needing a new push.
  #
  # Every job transitively needs resolve-context, so skipping it here skips the
  # rest -- except deploy-frontend and comment-summary, whose always()/!failure()
  # conditions ignore skipped dependencies and so repeat this guard explicitly.
  resolve-context:
    if: >-
      ${{ github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type == 'User'
      && !contains(github.event.pull_request.labels.*.name, 'no-deploy')) }}
    uses: ./.github/workflows/resolve-deployment-context.yml

  lane-config-validate:
    name: Resolve lane config
    needs: [resolve-context]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    outputs:
      frontend-origin-url: ${{ steps.compute.outputs.frontend-origin-url }}
      auth-disabled: ${{ steps.export-auth.outputs.auth-disabled }}
      auth-issuer: ${{ steps.export-auth.outputs.auth-issuer }}
      auth-audience: ${{ steps.export-auth.outputs.auth-audience }}
      auth-jwks-uri: ${{ steps.export-auth.outputs.auth-jwks-uri }}
      auth0-domain: ${{ steps.export-auth.outputs.auth0-domain }}
      auth0-client-id: ${{ steps.export-auth.outputs.auth0-client-id }}
      auth0-audience: ${{ steps.export-auth.outputs.auth0-audience }}
      stitch-llm-azure-openai-base-url: ${{ steps.export-auth.outputs.stitch-llm-azure-openai-base-url }}
      stitch-llm-azure-openai-model: ${{ steps.export-auth.outputs.stitch-llm-azure-openai-model }}
      stitch-llm-azure-openai-timeout-seconds: ${{ steps.export-auth.outputs.stitch-llm-azure-openai-timeout-seconds }}
      ghcr-etl-pull-username: ${{ steps.export-auth.outputs.ghcr-etl-pull-username }}
      etl-storage-name: ${{ steps.export-auth.outputs.etl-storage-name }}
    env:
      FRONTEND_PRODUCTION_URL: ${{ vars.FRONTEND_PRODUCTION_URL }}
      FRONTEND_PREVIEW_URL_TEMPLATE: ${{ vars.FRONTEND_PREVIEW_URL_TEMPLATE }}
      AUTH_DISABLED: ${{ vars.AUTH_DISABLED }}
      AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
      AUTH_JWKS_URI: ${{ vars.AUTH_JWKS_URI }}
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      STITCH_LLM_AZURE_OPENAI_BASE_URL: ${{ vars.STITCH_LLM_AZURE_OPENAI_BASE_URL }}
      STITCH_LLM_AZURE_OPENAI_MODEL: ${{ vars.STITCH_LLM_AZURE_OPENAI_MODEL }}
      STITCH_LLM_AZURE_OPENAI_TIMEOUT_SECONDS: ${{ vars.STITCH_LLM_AZURE_OPENAI_TIMEOUT_SECONDS }}
      GHCR_ETL_PULL_USERNAME: ${{ vars.GHCR_ETL_PULL_USERNAME }}
      ETL_STORAGE_NAME: ${{ vars.ETL_STORAGE_NAME }}
      STITCH_APP_PASSWORD: ${{ secrets.STITCH_APP_PASSWORD }}
      STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN: ${{ secrets.STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN }}
      STITCH_CLIENT_LLM_BEARER_TOKEN: ${{ secrets.STITCH_CLIENT_LLM_BEARER_TOKEN }}
      STITCH_LLM_AZURE_OPENAI_API_KEY: ${{ secrets.STITCH_LLM_AZURE_OPENAI_API_KEY }}
    steps:
      - name: Validate lane variables
        shell: bash
        run: |
          set -euo pipefail
          : "${FRONTEND_PRODUCTION_URL:?Missing required variable FRONTEND_PRODUCTION_URL}"
          : "${FRONTEND_PREVIEW_URL_TEMPLATE:?Missing required variable FRONTEND_PREVIEW_URL_TEMPLATE}"
          : "${AUTH_DISABLED:?Missing required variable AUTH_DISABLED}"
          : "${AUTH0_DOMAIN:?Missing required variable AUTH0_DOMAIN}"
          : "${AUTH0_CLIENT_ID:?Missing required variable AUTH0_CLIENT_ID}"
          : "${AUTH0_AUDIENCE:?Missing required variable AUTH0_AUDIENCE}"
          : "${STITCH_APP_PASSWORD:?Missing required secret STITCH_APP_PASSWORD}"
          : "${STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN:?Missing required secret STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN}"
          : "${STITCH_CLIENT_LLM_BEARER_TOKEN:?Missing required secret STITCH_CLIENT_LLM_BEARER_TOKEN}"

          case "${AUTH_DISABLED}" in
            true|false) ;;
            *)
              echo "Invalid AUTH_DISABLED: '${AUTH_DISABLED}'. Expected 'true' or 'false'." >&2
              exit 1
              ;;
          esac

          if [ "${AUTH_DISABLED}" = "false" ]; then
            : "${AUTH_ISSUER:?Missing required variable AUTH_ISSUER}"
            : "${AUTH_AUDIENCE:?Missing required variable AUTH_AUDIENCE}"
            : "${AUTH_JWKS_URI:?Missing required variable AUTH_JWKS_URI}"
          fi

          has_llm_base_url=false
          has_llm_model=false
          has_llm_api_key=false

          [ -n "${STITCH_LLM_AZURE_OPENAI_BASE_URL:-}" ] && has_llm_base_url=true
          [ -n "${STITCH_LLM_AZURE_OPENAI_MODEL:-}" ] && has_llm_model=true
          [ -n "${STITCH_LLM_AZURE_OPENAI_API_KEY:-}" ] && has_llm_api_key=true

          if $has_llm_base_url || $has_llm_model || $has_llm_api_key; then
            : "${STITCH_LLM_AZURE_OPENAI_BASE_URL:?Missing required variable STITCH_LLM_AZURE_OPENAI_BASE_URL}"
            : "${STITCH_LLM_AZURE_OPENAI_MODEL:?Missing required variable STITCH_LLM_AZURE_OPENAI_MODEL}"
            : "${STITCH_LLM_AZURE_OPENAI_API_KEY:?Missing required secret STITCH_LLM_AZURE_OPENAI_API_KEY}"
          fi

      - name: Compute frontend origin
        id: compute
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_NAME: ${{ needs.resolve-context.outputs.deployment-name }}
          DEPLOYMENT_LANE: ${{ needs.resolve-context.outputs.deployment-lane }}
        run: |
          set -euo pipefail

          if [ "${DEPLOYMENT_LANE}" = "dress-rehearsal" ]; then
            frontend_origin_url="${FRONTEND_PRODUCTION_URL}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            frontend_origin_url="${FRONTEND_PREVIEW_URL_TEMPLATE//\{name\}/${PR_NUMBER}}"
          else
            frontend_origin_url="${FRONTEND_PREVIEW_URL_TEMPLATE//\{name\}/${TARGET_NAME}}"
          fi

          echo "frontend-origin-url=$frontend_origin_url" >> "$GITHUB_OUTPUT"

      - name: Export auth config
        id: export-auth
        shell: bash
        run: |
          set -euo pipefail
          echo "auth-disabled=${AUTH_DISABLED}" >> "$GITHUB_OUTPUT"
          echo "auth-issuer=${AUTH_ISSUER}" >> "$GITHUB_OUTPUT"
          echo "auth-audience=${AUTH_AUDIENCE}" >> "$GITHUB_OUTPUT"
          echo "auth-jwks-uri=${AUTH_JWKS_URI}" >> "$GITHUB_OUTPUT"
          echo "auth0-domain=${AUTH0_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "auth0-client-id=${AUTH0_CLIENT_ID}" >> "$GITHUB_OUTPUT"
          echo "auth0-audience=${AUTH0_AUDIENCE}" >> "$GITHUB_OUTPUT"
          echo "stitch-llm-azure-openai-base-url=${STITCH_LLM_AZURE_OPENAI_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "stitch-llm-azure-openai-model=${STITCH_LLM_AZURE_OPENAI_MODEL}" >> "$GITHUB_OUTPUT"
          echo "stitch-llm-azure-openai-timeout-seconds=${STITCH_LLM_AZURE_OPENAI_TIMEOUT_SECONDS:-30}" >> "$GITHUB_OUTPUT"
          echo "ghcr-etl-pull-username=${GHCR_ETL_PULL_USERNAME:-}" >> "$GITHUB_OUTPUT"
          echo "etl-storage-name=${ETL_STORAGE_NAME:-}" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: "Build frontend"
    needs: [resolve-context]
    uses: ./.github/workflows/node-build.yml
    secrets: inherit

  build-api-docker-image:
    name: "Build and publish API"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/api/Dockerfile
      image-name: ${{ github.event.repository.name }}-api
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  check-db-migrations:
    name: "Check DB Migrations (clean)"
    needs: [build-api-docker-image]
    uses: ./.github/workflows/check-alembic.yml
    permissions:
      contents: read
      packages: read
    with:
      full-image-name: ${{ needs.build-api-docker-image.outputs.digest-image-name }}

  build-entity-linkage-docker-image:
    name: "Build and publish Entity Linkage"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/entity-linkage/Dockerfile
      image-name: ${{ github.event.repository.name }}-entity-linkage
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  build-stitch-llm-docker-image:
    name: "Build and publish Stitch LLM"
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/stitch-llm/Dockerfile
      image-name: ${{ github.event.repository.name }}-stitch-llm
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  build-loadtest-docker-image:
    name: "Build and publish Load test (k6)"
    # Runs only in development (against the per-PR instance). This image carries
    # both the k6 load test and the k6 seeder (seed.dist.js) — it replaces the
    # former Python seed image; non-development lanes are populated by the ETL
    # pipelines instead.
    if: ${{ needs.resolve-context.outputs.deployment-lane == 'development' }}
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/loadtest/Dockerfile
      image-name: ${{ github.event.repository.name }}-loadtest
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  # The collector is a single shared app per lane, so it must NOT be rebuilt and
  # redeployed on every PR: that churns a resource other PRs in the lane are
  # actively using and wastes a full image build each time. Gate build+deploy on
  # "collector files actually changed" OR a canonical push (main/production);
  # routine PRs skip it and resolve-otel-collector just looks up the existing URL.
  detect-collector-changes:
    name: "Detect OTel Collector changes"
    needs: [resolve-context]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
          else
            base="$PR_BASE_SHA"
          fi
          # Unknown/all-zero base (new branch, first push, manual dispatch):
          # can't diff, so treat as changed and let the deploy run.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$HEAD_SHA" | grep -qE '^deployments/otel-collector/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-otel-collector-docker-image:
    name: "Build and publish OTel Collector"
    needs: [resolve-context, detect-collector-changes]
    # Only (re)build when the collector actually changed or on a canonical push.
    if: ${{ github.event_name == 'push' || needs.detect-collector-changes.outputs.changed == 'true' }}
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/otel-collector/Dockerfile
      image-name: ${{ github.event.repository.name }}-otel-collector
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  # No explicit `if:` needed — this auto-skips when the build above is skipped.
  deploy-otel-collector:
    name: "Deploy OTel Collector"
    needs: [resolve-context, build-otel-collector-docker-image]
    uses: ./.github/workflows/deploy-container.yml
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      applicationinsights-connection-string: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build-otel-collector-docker-image.outputs.digest-image-name }}
      # Lane-scoped name: all deployments in the same lane share one collector.
      container-app-name: ${{ format('{0}-otel-collector', needs.resolve-context.outputs.deployment-lane) }}
      # OTLP/HTTP receiver; services export over the Container Apps HTTPS ingress.
      target-port: 4318
      deployment-label: otel-collector
      # Always keep one replica so spans are not dropped during cold-start.
      min-replicas: "1"
      environment-variables: ""

  # Always resolves the shared collector's ingress URL for the service deploys,
  # whether or not it was redeployed this run (the ingress FQDN is stable across
  # revisions). Fails loudly if the lane's collector was never bootstrapped.
  resolve-otel-collector:
    name: "Resolve OTel Collector URL"
    needs: [resolve-context, deploy-otel-collector]
    # Run even when deploy-otel-collector was skipped (routine PR); only bail if
    # resolve-context was skipped (no-deploy) or a deploy that ran actually failed.
    if: ${{ !cancelled() && needs.resolve-context.result == 'success' && (needs.deploy-otel-collector.result == 'success' || needs.deploy-otel-collector.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    permissions:
      id-token: write
      contents: read
    outputs:
      container-app-url: ${{ steps.resolve.outputs.container-app-url }}
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve collector ingress URL
        id: resolve
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          COLLECTOR_APP: ${{ format('{0}-otel-collector', needs.resolve-context.outputs.deployment-lane) }}
        run: |
          set -euo pipefail
          fqdn="$(
            az containerapp show \
              --name "$COLLECTOR_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv 2>/dev/null || true
          )"
          if [ -z "$fqdn" ]; then
            echo "::error::OTel collector '$COLLECTOR_APP' not found in resource group '$AZURE_RESOURCE_GROUP'. It is (re)deployed only on push to main/production or when deployments/otel-collector/** changes; bootstrap this lane's collector with one such deploy before PR deploys can resolve it." >&2
            exit 1
          fi
          echo "Resolved collector URL: https://$fqdn"
          echo "container-app-url=https://$fqdn" >> "$GITHUB_OUTPUT"

  deploy-db:
    name: "Create DB"
    needs: [resolve-context]
    uses: ./.github/workflows/deploy-db.yml
    secrets:
      pgpassword: ${{ secrets.PGPASSWORD }}
      stitch-migrator-password: ${{ secrets.STITCH_MIGRATOR_PASSWORD }}
      stitch-app-password: ${{ secrets.STITCH_APP_PASSWORD }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      deployment-name: ${{ needs.resolve-context.outputs.deployment-name }}

  run-db-migrations:
    name: "Run DB Migrations"
    needs: [resolve-context, build-api-docker-image, deploy-db]
    uses: ./.github/workflows/run-alembic.yml
    secrets:
      stitch-migrator-password: ${{ secrets.STITCH_MIGRATOR_PASSWORD }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build-api-docker-image.outputs.digest-image-name }}
      postgres-host: ${{ needs.deploy-db.outputs.postgres-host }}
      postgres-port: ${{ needs.deploy-db.outputs.postgres-port }}
      postgres-db: ${{ needs.deploy-db.outputs.postgres-db }}
      postgres-sslmode: ${{ needs.deploy-db.outputs.postgres-sslmode }}

  check-db-migrations-live:
    name: "Check DB Migrations (live)"
    needs: [resolve-context, build-api-docker-image, deploy-db, run-db-migrations]
    uses: ./.github/workflows/check-alembic.yml
    permissions:
      contents: read
      packages: read
    secrets:
      stitch-app-password: ${{ secrets.STITCH_APP_PASSWORD }}
    with:
      full-image-name: ${{ needs.build-api-docker-image.outputs.digest-image-name }}
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      postgres-host: ${{ needs.deploy-db.outputs.postgres-host }}
      postgres-port: ${{ needs.deploy-db.outputs.postgres-port }}
      postgres-db: ${{ needs.deploy-db.outputs.postgres-db }}
      postgres-sslmode: ${{ needs.deploy-db.outputs.postgres-sslmode }}

  deploy-api:
    name: "Deploy API"
    needs: [resolve-context, lane-config-validate, build-api-docker-image, deploy-db, run-db-migrations, resolve-otel-collector]
    uses: ./.github/workflows/deploy-container.yml
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      stitch-app-password: ${{ secrets.STITCH_APP_PASSWORD }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build-api-docker-image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-api', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        LOG_LEVEL=debug
        FRONTEND_ORIGIN_URL=${{ needs.lane-config-validate.outputs.frontend-origin-url }}
        AUTH_DISABLED=${{ needs.lane-config-validate.outputs.auth-disabled }}
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        ENVIRONMENT=${{ needs.resolve-context.outputs.deployment-name }}
        AUTH_ISSUER=${{ needs.lane-config-validate.outputs.auth-issuer }}
        AUTH_AUDIENCE=${{ needs.lane-config-validate.outputs.auth-audience }}
        AUTH_JWKS_URI=${{ needs.lane-config-validate.outputs.auth-jwks-uri }}
        POSTGRES_HOST=${{ needs.deploy-db.outputs.postgres-host }}
        POSTGRES_PORT=${{ needs.deploy-db.outputs.postgres-port }}
        POSTGRES_DB=${{ needs.deploy-db.outputs.postgres-db }}
        POSTGRES_USER=${{ needs.deploy-db.outputs.postgres-user }}
        PGSSLMODE=${{ needs.deploy-db.outputs.postgres-sslmode }}
        OTEL_TRACES_EXPORTER=otlp
        OTEL_EXPORTER_OTLP_PROTOCOL=http
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ format('{0}/v1/traces', needs.resolve-otel-collector.outputs.container-app-url) }}
        OTEL_SERVICE_NAME=stitch-api
        OTEL_RESOURCE_ATTRIBUTES=deployment.name=${{ needs.resolve-context.outputs.deployment-name }},deployment.lane=${{ needs.resolve-context.outputs.deployment-lane }},service.version=${{ github.sha }}
      deployment-label: api
      # Keep staging / dress-rehearsal always-on; development scales to zero.
      min-replicas: ${{ needs.resolve-context.outputs.deployment-lane != 'development' && '1' || '' }}

  deploy-entity-linkage:
    name: "Deploy entity linkage"
    needs: [resolve-context, lane-config-validate, build-entity-linkage-docker-image, deploy-api, resolve-otel-collector]
    uses: ./.github/workflows/deploy-container.yml
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      stitch-client-bearer-token: ${{ secrets.STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build-entity-linkage-docker-image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-entity-linkage', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        LOG_LEVEL=info
        AUTH_DISABLED=${{ needs.lane-config-validate.outputs.auth-disabled }}
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        AUTH_ISSUER=${{ needs.lane-config-validate.outputs.auth-issuer }}
        AUTH_AUDIENCE=${{ needs.lane-config-validate.outputs.auth-audience }}
        AUTH_JWKS_URI=${{ needs.lane-config-validate.outputs.auth-jwks-uri }}
        ENTITY_LINKAGE_API_BASE_URL=${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
        ENTITY_LINKAGE_FRONTEND_ORIGIN_URL=${{ needs.lane-config-validate.outputs.frontend-origin-url }}
        OTEL_TRACES_EXPORTER=otlp
        OTEL_EXPORTER_OTLP_PROTOCOL=http
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ format('{0}/v1/traces', needs.resolve-otel-collector.outputs.container-app-url) }}
        OTEL_SERVICE_NAME=stitch-entity-linkage
        OTEL_RESOURCE_ATTRIBUTES=deployment.name=${{ needs.resolve-context.outputs.deployment-name }},deployment.lane=${{ needs.resolve-context.outputs.deployment-lane }},service.version=${{ github.sha }}
      deployment-label: entity-linkage
      # Keep staging / dress-rehearsal always-on; development scales to zero.
      min-replicas: ${{ needs.resolve-context.outputs.deployment-lane != 'development' && '1' || '' }}
      # Unoptimized service; needs more than the default ~0.5 vCPU / 1 GiB.
      # 4 GiB on the Consumption profile is only valid paired with 2.0 vCPU.
      cpu: "2.0"
      memory: "4.0Gi"

  deploy-stitch-llm:
    name: "Deploy stitch-llm"
    needs: [resolve-context, lane-config-validate, build-stitch-llm-docker-image, deploy-api, resolve-otel-collector]
    uses: ./.github/workflows/deploy-container.yml
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      stitch-client-bearer-token: ${{ secrets.STITCH_CLIENT_LLM_BEARER_TOKEN }}
      stitch-llm-azure-openai-api-key: ${{ secrets.STITCH_LLM_AZURE_OPENAI_API_KEY }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ${{ needs.build-stitch-llm-docker-image.outputs.digest-image-name }}
      container-app-name: ${{ format('{0}-stitch-llm', needs.resolve-context.outputs.deployment-name) }}
      environment-variables: >-
        STITCH_LLM_LOG_LEVEL=info
        AUTH_DISABLED=${{ needs.lane-config-validate.outputs.auth-disabled }}
        DEPLOYMENT_LANE=${{ needs.resolve-context.outputs.deployment-lane }}
        DEPLOYMENT_NAME=${{ needs.resolve-context.outputs.deployment-name }}
        AUTH_ISSUER=${{ needs.lane-config-validate.outputs.auth-issuer }}
        AUTH_AUDIENCE=${{ needs.lane-config-validate.outputs.auth-audience }}
        AUTH_JWKS_URI=${{ needs.lane-config-validate.outputs.auth-jwks-uri }}
        STITCH_LLM_API_BASE_URL=${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
        STITCH_LLM_FRONTEND_ORIGIN_URL=${{ needs.lane-config-validate.outputs.frontend-origin-url }}
        STITCH_LLM_AZURE_OPENAI_BASE_URL=${{ needs.lane-config-validate.outputs.stitch-llm-azure-openai-base-url }}
        STITCH_LLM_AZURE_OPENAI_MODEL=${{ needs.lane-config-validate.outputs.stitch-llm-azure-openai-model }}
        STITCH_LLM_AZURE_OPENAI_TIMEOUT_SECONDS=${{ needs.lane-config-validate.outputs.stitch-llm-azure-openai-timeout-seconds }}
        OTEL_TRACES_EXPORTER=otlp
        OTEL_EXPORTER_OTLP_PROTOCOL=http
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ format('{0}/v1/traces', needs.resolve-otel-collector.outputs.container-app-url) }}
        OTEL_SERVICE_NAME=stitch-llm
        OTEL_RESOURCE_ATTRIBUTES=deployment.name=${{ needs.resolve-context.outputs.deployment-name }},deployment.lane=${{ needs.resolve-context.outputs.deployment-lane }},service.version=${{ github.sha }}
      deployment-label: stitch-llm
      # Keep staging / dress-rehearsal always-on; development scales to zero.
      min-replicas: ${{ needs.resolve-context.outputs.deployment-lane != 'development' && '1' || '' }}

  deploy-etl:
    name: "Deploy ETL"
    if: ${{ needs.resolve-context.outputs.deployment-lane != 'development' }}
    needs: [resolve-context, lane-config-validate, deploy-api]
    uses: ./.github/workflows/deploy-container.yml
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      stitch-client-bearer-token: ${{ secrets.STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN }}
      woodmac-api-key: ${{ secrets.WOODMAC_API_KEY }}
      registry-password: ${{ secrets.GHCR_ETL_PULL_TOKEN }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      full-image-name: ghcr.io/rmi/stitch-etl-poc:${{ vars.ETL_IMAGE_TAG || 'main' }}
      container-app-name: ${{ format('{0}-etl', needs.resolve-context.outputs.deployment-name) }}
      registry-server: ghcr.io
      registry-username: ${{ needs.lane-config-validate.outputs.ghcr-etl-pull-username }}
      # One job per dataset + in-memory /status state: keep exactly one replica.
      min-replicas: "1"
      max-replicas: "1"
      # WoodMac is unoptimized; needs more than the default ~0.5 vCPU / 1 GiB.
      # 4 GiB on the Consumption profile is only valid paired with 2.0 vCPU.
      cpu: "2.0"
      memory: "4.0Gi"
      environment-variables: >-
        ETL_LOG_LEVEL=info
        AUTH_DISABLED=${{ needs.lane-config-validate.outputs.auth-disabled }}
        AUTH_ISSUER=${{ needs.lane-config-validate.outputs.auth-issuer }}
        AUTH_AUDIENCE=${{ needs.lane-config-validate.outputs.auth-audience }}
        AUTH_JWKS_URI=${{ needs.lane-config-validate.outputs.auth-jwks-uri }}
        API_BASE_URL=${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
        ETL_FRONTEND_ORIGIN_URL=${{ needs.lane-config-validate.outputs.frontend-origin-url }}
        GEM_FILE_DIR=/mnt/data/gem
        WOODMAC_DATA_DIR=/mnt/data/woodmac
      deployment-label: etl
      # Mount the lane's Azure Files share; GEM reads gem/, WoodMac caches under woodmac/.
      storage-name: ${{ needs.lane-config-validate.outputs.etl-storage-name }}
      storage-mount-path: /mnt/data

  run-perf:
    name: "Run perf (seed + load test)"
    # Runs only in development (against the per-PR instance); non-development
    # lanes use the ETL pipelines to populate data. Seed only on a freshly
    # created DB; the load test runs on every development-lane run.
    if: ${{ needs.resolve-context.outputs.deployment-lane == 'development' }}
    needs: [resolve-context, build-loadtest-docker-image, deploy-db, deploy-api]
    uses: ./.github/workflows/run-perf.yml
    secrets:
      stitch-client-bearer-token: ${{ secrets.STITCH_CLIENT_PRIVILEGED_BEARER_TOKEN }}
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      api-url: ${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
      run-seed: ${{ needs.deploy-db.outputs.database-created == 'true' }}
      run-loadtest: true
      loadtest-image-name: ${{ needs.build-loadtest-docker-image.outputs.digest-image-name }}

  deploy-frontend:
    name: "Deploy frontend"
    # ETL deploys are skipped in the development lane; gate on no-failure rather
    # than all-success so the frontend still deploys when they are skipped.
    # The human-author clause repeats the resolve-context guard because
    # !failure() also passes when upstream jobs were skipped by that guard.
    if: >-
      ${{ (!failure() && !cancelled())
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type == 'User'
      && !contains(github.event.pull_request.labels.*.name, 'no-deploy'))) }}
    needs: [resolve-context, lane-config-validate, build-frontend, deploy-api, deploy-entity-linkage, deploy-stitch-llm, deploy-etl]
    uses: ./.github/workflows/azure-static-web-apps.yml
    secrets:
      azure-static-web-apps-deploy-token: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
    with:
      deployment-lane: ${{ needs.resolve-context.outputs.deployment-lane }}
      artifact-name: dist-tgz
      deployment-name: ${{ needs.resolve-context.outputs.deployment-name }}
      api-url: ${{ format('{0}/api/v1', needs.deploy-api.outputs.container-app-url) }}
      entity-linkage-url: ${{ format('{0}/api/v1', needs.deploy-entity-linkage.outputs.container-app-url) }}
      stitch-llm-url: ${{ format('{0}/api/v1', needs.deploy-stitch-llm.outputs.container-app-url) }}
      etl-url: ${{ needs.deploy-etl.result == 'success' && format('{0}/api/v1/etl', needs.deploy-etl.outputs.container-app-url) || '' }}
      auth0-domain: ${{ needs.lane-config-validate.outputs.auth0-domain }}
      auth0-client-id: ${{ needs.lane-config-validate.outputs.auth0-client-id }}
      auth0-audience: ${{ needs.lane-config-validate.outputs.auth0-audience }}
      production-branch: production

  comment-summary:
    # always() ignores the resolve-context guard's skips, so repeat it here too --
    # including the 'no-deploy' exclusion, so a skipped pipeline posts no summary.
    if: >-
      ${{ always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type == 'User'
      && !contains(github.event.pull_request.labels.*.name, 'no-deploy') }}
    uses: ./.github/workflows/comment-pr-summary.yml
    secrets: inherit
    needs: [resolve-context, build-api-docker-image, build-entity-linkage-docker-image, build-stitch-llm-docker-image, build-loadtest-docker-image, deploy-db, run-db-migrations, deploy-api, deploy-entity-linkage, deploy-stitch-llm, deploy-etl, run-perf, deploy-frontend]
