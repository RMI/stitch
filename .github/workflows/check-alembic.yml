---
on:
  workflow_call:
    inputs:
      full-image-name:
        description: "Digest-pinned image reference (host/registry/name@sha256:...) to run alembic with"
        required: true
        type: string
      postgres-host:
        description: >
          Live Postgres host. When omitted, a throwaway Postgres is started
          locally and migrations are run to head before the check.
        required: false
        default: ""
        type: string
      postgres-port:
        required: false
        default: "5432"
        type: string
      postgres-db:
        required: false
        default: "stitch"
        type: string
      postgres-sslmode:
        required: false
        default: "disable"
        type: string
      deployment-lane:
        description: >
          Deployment environment name (e.g. preview, dress-rehearsal). When
          provided, the job runs in that GH environment and reads STITCH_APP_PASSWORD
          directly from its secrets. Required for the live DB check; omit for the
          throwaway path (password is read from env.example instead).
        required: false
        default: ""
        type: string
    secrets:
      stitch-app-password:
        description: >
          stitch_app password. Required for live DB checks. For the throwaway
          path this is read from env.example instead.
        required: false

name: Check DB Migrations

jobs:
  check-migrations:
    name: "alembic check (migration drift)"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-lane || null }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up example Env file
        run: cp env.example .env

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull API image
        run: docker pull "${{ inputs.full-image-name }}"

      - name: Start throwaway Postgres
        if: ${{ inputs.postgres-host == '' }}
        run: docker compose -f docker-compose.yml up -d --wait db

      # Only needed for the throwaway path — the live DB is already at head.
      # POSTGRES_PASSWORD must be remapped from STITCH_MIGRATOR_PASSWORD since .env
      # sets POSTGRES_PASSWORD to the stitch_app credential, not the migrator's.
      - name: Apply migrations (upgrade head)
        if: ${{ inputs.postgres-host == '' }}
        env:
          IMAGE: ${{ inputs.full-image-name }}
        run: |
          set -euo pipefail
          _migrator_password=$(grep '^STITCH_MIGRATOR_PASSWORD=' .env | cut -d= -f2-)
          docker run --rm --network host \
            --env-file .env \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_USER=stitch_migrator \
            -e POSTGRES_PASSWORD="${_migrator_password}" \
            -e PGSSLMODE=disable \
            "$IMAGE" \
            alembic -c deployments/api/alembic.ini upgrade head

      - name: Check for migration drift
        env:
          IMAGE: ${{ inputs.full-image-name }}
          POSTGRES_HOST: ${{ inputs.postgres-host || '127.0.0.1' }}
          POSTGRES_PORT: ${{ inputs.postgres-port }}
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: stitch_app
          PGSSLMODE: ${{ inputs.postgres-sslmode }}
          SECRET_APP_PASSWORD: ${{ secrets.stitch-app-password }}
        run: |
          set -euo pipefail
          # Grep rather than sourcing .env wholesale — sourcing would overwrite the GH env
          # vars above (e.g. POSTGRES_HOST=db would clobber the 127.0.0.1 we set).
          # Use assignment form (-e KEY=VALUE) so the resolved password reaches the container
          # rather than relying on the shell variable being exported.
          _env_app_password=$(grep '^STITCH_APP_PASSWORD=' .env | cut -d= -f2-)
          docker run --rm --network host \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_DB \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD="${SECRET_APP_PASSWORD:-${_env_app_password}}" \
            -e PGSSLMODE \
            "$IMAGE" \
            alembic -c deployments/api/alembic.ini check

      - name: Tear down throwaway Postgres
        if: ${{ always() && inputs.postgres-host == '' }}
        run: docker compose -f docker-compose.yml down -v
