---
on:
  workflow_call:
    inputs:
      deployment-lane:
        description: "Deployment lane and GitHub Environment name"
        required: true
        type: string
      deployment-name:
        description: "Concrete deployment target name"
        required: true
        type: string
      restore-from-backup:
        description: "Restore a backup into the database when it has no tables yet"
        required: false
        default: false
        type: boolean
      backup-url:
        description: >-
          Full blob URL of the backup to restore. Empty restores the newest
          production backup.
        required: false
        default: ""
        type: string
    secrets:
      pgpassword:
        required: true
      stitch-migrator-password:
        required: true
      stitch-app-password:
        required: true
      azure-tenant-id:
        description: "Required when restore-from-backup is true"
        required: false
    outputs:
      database-created:
        description: "Whether this workflow created the database during this run"
        value: ${{ jobs.create-db.outputs.database-created }}
      postgres-host:
        description: "Database server hostname"
        value: ${{ jobs.create-db.outputs.postgres-host }}
      postgres-port:
        description: "Database server port"
        value: ${{ jobs.create-db.outputs.postgres-port }}
      postgres-db:
        description: "Database name"
        value: ${{ jobs.create-db.outputs.postgres-db }}
      postgres-user:
        description: "Application database user"
        value: ${{ jobs.create-db.outputs.postgres-user }}
      postgres-sslmode:
        description: "Database SSL mode"
        value: ${{ jobs.create-db.outputs.postgres-sslmode }}

name: Create Database

jobs:
  create-db:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-lane }}
    permissions:
      id-token: write
      contents: read
    outputs:
      database-created: ${{ steps.create-db.outputs.database-created }}
      postgres-host: ${{ steps.export-db-config.outputs.postgres-host }}
      postgres-port: ${{ steps.export-db-config.outputs.postgres-port }}
      postgres-db: ${{ steps.export-db-config.outputs.postgres-db }}
      postgres-user: ${{ steps.export-db-config.outputs.postgres-user }}
      postgres-sslmode: ${{ steps.export-db-config.outputs.postgres-sslmode }}
    env:
      PGHOST: ${{ vars.POSTGRES_HOST }}
      PGPORT: ${{ vars.POSTGRES_PORT || '5432' }}
      PGUSER: ${{ vars.POSTGRES_ADMIN_USER || 'postgres' }}
      PGPASSWORD: ${{ secrets.pgpassword }}
      PGSSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
      PGDATABASE: ${{ vars.POSTGRES_DEFAULT_DB || 'postgres' }}
      DB_NAME_RAW: ${{ inputs.deployment-name }}
    steps:
      - name: Validate lane config
        shell: bash
        run: |
          set -euo pipefail
          : "${PGHOST:?Missing required variable POSTGRES_HOST}"
          : "${PGPORT:?Missing required variable POSTGRES_PORT}"
          : "${PGUSER:?Missing required variable POSTGRES_ADMIN_USER}"
          : "${PGPASSWORD:?Missing required secret PGPASSWORD}"
          case "${PGSSLMODE}" in
            disable|allow|prefer|require|verify-ca|verify-full) ;;
            *)
              echo "Invalid POSTGRES_SSLMODE: '${PGSSLMODE}'. Expected one of: disable, allow, prefer, require, verify-ca, verify-full." >&2
              exit 1
              ;;
          esac

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Normalize DB name
        id: normalize-name
        run: |
          set -euox pipefail
          RAW_NAME="${DB_NAME_RAW}"
          # Lowercase
          CLEAN=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
          # Replace anything not a-z, 0-9, or underscore with underscore
          CLEAN=$(echo "$CLEAN" | sed -E 's/[^a-z0-9_]/_/g')
          # Trim to 63 chars (Postgres identifier limit)
          CLEAN=$(echo "$CLEAN" | cut -c1-63)
          echo "db-name=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Export DB config
        id: export-db-config
        run: |
          set -euo pipefail
          echo "postgres-host=${PGHOST}" >> "$GITHUB_OUTPUT"
          echo "postgres-port=${PGPORT}" >> "$GITHUB_OUTPUT"
          echo "postgres-db=${{ steps.normalize-name.outputs.db-name }}" >> "$GITHUB_OUTPUT"
          echo "postgres-user=stitch_app" >> "$GITHUB_OUTPUT"
          echo "postgres-sslmode=${PGSSLMODE}" >> "$GITHUB_OUTPUT"

      - name: Drop database on long-lived deployments
        if: ${{ inputs.deployment-lane == 'development' && github.ref_name == 'main' }}
        env:
          DB_NAME: ${{ steps.normalize-name.outputs.db-name }}
        run: |
          set -euo pipefail

          echo "Target server: $PGHOST"
          echo "Resetting DB: $DB_NAME"

          EXISTS=$(psql -X -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" || true)

          if [ "$EXISTS" = "1" ]; then
            psql -X -v ON_ERROR_STOP=1 -c "
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = '${DB_NAME}'
                AND pid <> pg_backend_pid();
            "
            psql -X -v ON_ERROR_STOP=1 -c "DROP DATABASE \"${DB_NAME}\";"
            echo "Database '$DB_NAME' dropped."
          else
            echo "Database '$DB_NAME' does not exist. Nothing to drop."
          fi

      - name: Create database if it doesn't exist
        id: create-db
        env:
          DB_NAME: ${{ steps.normalize-name.outputs.db-name }}
        run: |
          set -euo pipefail

          echo "Target server: $PGHOST"
          echo "Creating DB: $DB_NAME"

          # Check existence first (CREATE DATABASE doesn't support IF NOT EXISTS)
          EXISTS=$(psql -X -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" || true)

          if [ "$EXISTS" = "1" ]; then
            echo "Database '$DB_NAME' already exists. Skipping."
            echo "database-created=false" >> "$GITHUB_OUTPUT"
          else
            psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${DB_NAME}\";"
            echo "Database '$DB_NAME' created."
            echo "database-created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run DB initialization script
        env:
          POSTGRES_DB: ${{ steps.normalize-name.outputs.db-name }}
          POSTGRES_USER: ${{ env.PGUSER }}
          STITCH_MIGRATOR_PASSWORD: ${{ secrets.stitch-migrator-password }}
          STITCH_APP_PASSWORD: ${{ secrets.stitch-app-password }}
        run: deployments/db/00-init-roles.sh

      # Restore only into an empty database, so a redeploy never overwrites
      # data. The restore is a single transaction, so a failed or cancelled
      # one leaves the database empty and the next run tries again. To refresh
      # from a newer backup, drop the database (e.g. toggle the PR's
      # 'no-deploy' label) and let the next run recreate it.
      - name: Check whether the database is empty
        id: check-empty
        if: ${{ inputs.restore-from-backup }}
        env:
          DB_NAME: ${{ steps.normalize-name.outputs.db-name }}
        run: |
          set -euo pipefail
          has_tables=$(psql -X -tA -v ON_ERROR_STOP=1 --dbname "${DB_NAME}" \
            -c "SELECT EXISTS (SELECT 1 FROM pg_tables WHERE schemaname = 'public')")
          if [ "$has_tables" = "f" ]; then
            echo "Database '${DB_NAME}' is empty. Restoring a backup."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "Database '${DB_NAME}' already has tables. Skipping the restore."
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate restore config
        if: ${{ steps.check-empty.outputs.empty == 'true' }}
        env:
          RESTORE_AZURE_CLIENT_ID: ${{ vars.RESTORE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
        run: |
          set -euo pipefail
          : "${RESTORE_AZURE_CLIENT_ID:?Missing required variable RESTORE_AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Missing required secret AZURE_TENANT_ID}"

      # The restore identity only holds a blob-reader role on the backups
      # containers, so it has no subscription to select.
      - name: Azure login
        if: ${{ steps.check-empty.outputs.empty == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.RESTORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          allow-no-subscriptions: true

      - name: Resolve backup URL
        id: resolve-backup
        if: ${{ steps.check-empty.outputs.empty == 'true' }}
        env:
          PINNED_BACKUP_URL: ${{ inputs.backup-url }}
        run: |
          set -euo pipefail
          backup_url="$(scripts/db_restore.sh resolve --backup-url "${PINNED_BACKUP_URL}")"
          echo "Backup: $backup_url"
          echo "backup-url=$backup_url" >> "$GITHUB_OUTPUT"

      - name: Restore backup
        if: ${{ steps.check-empty.outputs.empty == 'true' }}
        env:
          DB_NAME: ${{ steps.normalize-name.outputs.db-name }}
          BACKUP_URL: ${{ steps.resolve-backup.outputs.backup-url }}
          PGPASSWORD: ${{ secrets.stitch-migrator-password }}
        run: scripts/db_restore.sh restore --database "${DB_NAME}" --backup-url "${BACKUP_URL}"

      - name: Write comment JSON
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          RESTORED_FROM: ${{ steps.resolve-backup.outputs.backup-url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/comment-json
          json_file="/tmp/comment-json/comment-json-db-deploy.json"

          jq -n \
            --arg section "database" \
            --arg kind "postgres_database" \
            --arg name "db" \
            --arg db_name "${{ steps.normalize-name.outputs.db-name }}" \
            --arg postgres_host "\`${PGHOST}\`" \
            --arg postgres_port "\`${PGPORT}\`" \
            --arg postgres_db "\`${{ steps.normalize-name.outputs.db-name }}\`" \
            --arg restored_from "${RESTORED_FROM}" \
            '{
              "section": $section,
              "kind": $kind,
              "name": $name,
              "warnings": [],
              "data": ({
                "db_name": $db_name,
                "postgres_host": $postgres_host,
                "postgres_port": $postgres_port,
                "postgres_db": $postgres_db
              } + (if $restored_from == "" then {}
                   else {"restored_from": ("`" + $restored_from + "`")} end))
            }' > "$json_file"

          jq empty "$json_file"
          cat "$json_file"

      - name: Upload comment JSON artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: comment-json-db-deploy
          path: /tmp/comment-json/*.json
          if-no-files-found: error
