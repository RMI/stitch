---
name: Close CI environment

on:
  pull_request:
    types: [closed]
  workflow_call:

jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      should-cleanup: ${{ steps.resolve.outputs.should-cleanup }}
      deployment-lane: ${{ steps.resolve.outputs.deployment-lane }}
      deployment-name: ${{ steps.resolve.outputs.deployment-name }}
    steps:
      - name: Resolve cleanup target
        id: resolve
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          normalize_name() {
            local raw="$1"
            echo "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g'
          }

          should_cleanup=false
          deployment_lane=""
          deployment_name=""

          if [ "$BASE_REF" = "main" ]; then
            should_cleanup=true
            deployment_lane="development"
            deployment_name="pr-$PR_NUMBER"
          elif [ "$BASE_REF" = "production" ] && [ "$HEAD_REF" = "next" ]; then
            should_cleanup=true
            deployment_lane="staging"
            deployment_name="next"
          elif [ "$BASE_REF" = "production" ] && [[ "$HEAD_REF" == hotfix/* ]]; then
            should_cleanup=true
            deployment_lane="staging"
            deployment_name="$(normalize_name "$HEAD_REF")"
          fi

          {
            echo "should-cleanup=$should_cleanup"
            echo "deployment-lane=$deployment_lane"
            echo "deployment-name=$deployment_name"
          } >> "$GITHUB_OUTPUT"

  drop-db:
    if: ${{ needs.resolve-context.outputs.should-cleanup == 'true' }}
    needs: [resolve-context]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    env:
      PGHOST: ${{ vars.POSTGRES_HOST }}
      PGPORT: ${{ vars.POSTGRES_PORT || '5432' }}
      PGUSER: ${{ vars.POSTGRES_ADMIN_USER || 'postgres' }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
      PGDATABASE: ${{ vars.POSTGRES_DEFAULT_DB || 'postgres' }}
      DB_NAME_RAW: ${{ needs.resolve-context.outputs.deployment-name }}
    steps:
      - name: Validate lane config
        shell: bash
        run: |
          set -euo pipefail
          : "${PGHOST:?Missing required variable POSTGRES_HOST}"
          : "${PGUSER:?Missing required variable POSTGRES_ADMIN_USER}"
          : "${PGPASSWORD:?Missing required secret PGPASSWORD}"

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Normalize DB name
        id: normalize-name
        run: |
          set -euox pipefail
          RAW_NAME="${DB_NAME_RAW}"
          CLEAN=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
          CLEAN=$(echo "$CLEAN" | sed -E 's/[^a-z0-9_]/_/g')
          CLEAN=$(echo "$CLEAN" | cut -c1-63)
          echo "db-name=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Drop database if it exists
        env:
          DB_NAME: ${{ steps.normalize-name.outputs.db-name }}
        run: |
          set -euox pipefail
          EXISTS=$(psql -X -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" || true)
          if [ "$EXISTS" != "1" ]; then
            echo "Database '$DB_NAME' does not exist. Skipping."
            exit 0
          fi
          psql -X -v ON_ERROR_STOP=1 -c "
            SELECT pg_terminate_backend(pid)
            FROM pg_stat_activity
            WHERE datname = '${DB_NAME}'
              AND pid <> pg_backend_pid();
          "
          psql -X -v ON_ERROR_STOP=1 -c "DROP DATABASE \"${DB_NAME}\";"

  delete-api-container-app:
    if: ${{ needs.resolve-context.outputs.should-cleanup == 'true' }}
    needs: [resolve-context]
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    steps:
      - name: Validate lane config
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing required variable AZURE_RESOURCE_GROUP}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension is available
        run: |
          az extension add --name containerapp --upgrade --allow-preview true

      - name: Delete Container App if it exists
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ format('{0}-api', needs.resolve-context.outputs.deployment-name) }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          EXISTS="$(
            az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "name" \
              --output tsv 2>/dev/null || true
          )"
          if [ -z "$EXISTS" ]; then
            exit 0
          fi
          az containerapp delete --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes

  delete-entity-linkage-container-app:
    if: ${{ needs.resolve-context.outputs.should-cleanup == 'true' }}
    needs: [resolve-context]
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    steps:
      - name: Validate lane config
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing required variable AZURE_RESOURCE_GROUP}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension is available
        run: |
          az extension add --name containerapp --upgrade --allow-preview true

      - name: Delete Container App if it exists
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ format('{0}-entity-linkage', needs.resolve-context.outputs.deployment-name) }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          EXISTS="$(
            az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "name" \
              --output tsv 2>/dev/null || true
          )"
          if [ -z "$EXISTS" ]; then
            exit 0
          fi
          az containerapp delete --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes

  delete-stitch-llm-container-app:
    if: ${{ needs.resolve-context.outputs.should-cleanup == 'true' }}
    needs: [resolve-context]
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    steps:
      - name: Validate lane config
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing required variable AZURE_RESOURCE_GROUP}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension is available
        run: |
          az extension add --name containerapp --upgrade --allow-preview true

      - name: Delete Container App if it exists
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ format('{0}-stitch-llm', needs.resolve-context.outputs.deployment-name) }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          EXISTS="$(
            az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "name" \
              --output tsv 2>/dev/null || true
          )"
          if [ -z "$EXISTS" ]; then
            exit 0
          fi
          az containerapp delete --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes

  close-static-web-app-preview:
    if: ${{ needs.resolve-context.outputs.should-cleanup == 'true' }}
    needs: [resolve-context]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.deployment-lane }}
    permissions:
      checks: write
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Validate lane secrets
        shell: bash
        env:
          AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN:?Missing required secret AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN}"

      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
