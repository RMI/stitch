---
on:
  workflow_call:

name: Rulesets Checks
concurrency: rulesets-checks

jobs:
  rulesets:
    name: "Check GH rulesets"
    runs-on: ubuntu-latest
    # Explicit rather than relying on the repo/org default token permissions.
    # NOTE: GITHUB_TOKEN has no `administration` scope; the ruleset read works
    # with the default read grants, so contents:read is the minimal useful
    # declaration here (checkout below).
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Calls the composite action directly (not the reusable-workflow wrapper)
      # while RMI/actions PR #10 is unmerged: the wrapper on that branch already
      # points at the composite @main, which doesn't exist until #10 lands.
      # Pinned to the PR #10 branch for now; once #10 merges, this can become the
      # one-line wrapper call:
      #   uses: RMI/actions/.github/workflows/admin-check-rulesets.yml@main
      - uses: RMI/actions/actions/admin/rulesets-check@feat/rulesets-check
