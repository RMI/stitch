name: Run seed job

on:
  workflow_call:
    inputs:
      deployment-lane:
        description: "Deployment lane and GitHub Environment name"
        required: true
        type: string
      full-image-name:
        description: "Full pushed image name including host/registry, name, and digest"
        required: true
        type: string
      api-url:
        description: "Base API URL for the deployed API"
        required: true
        type: string
      stitch-auth-client-id:
        description: "Auth0 M2M client_id for the seed app (repo variable value). Empty => no-header (local AUTH_DISABLED) path."
        required: false
        default: ""
        type: string
      stitch-auth-audience:
        description: "Auth0 API audience/identifier (same tenant/API as the lane)."
        required: false
        default: ""
        type: string
      stitch-auth-issuer-url:
        description: "Auth0 issuer URL, e.g. https://<tenant>/"
        required: false
        default: ""
        type: string
    secrets:
      stitch-auth-client-secret:
        required: false

jobs:
  run-seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-lane }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25

    steps:
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull seed image
        run: docker pull "${{ inputs.full-image-name }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run seed job
        env:
          API_BASE_URL: ${{ inputs.api-url }}
          FAKER_POST_COUNT: "5"
          LOG_LEVEL: "INFO"
          RANDOM_SEED: "8675309"
          SEED_SOURCE: "mixed"
          NULL_PROBABILITY: "0.3"
          STATIC_PAYLOAD_DIR: "/mnt/data"
          # Auth0 M2M client credentials. All four empty => seed attaches no
          # Authorization header (works against a local AUTH_DISABLED API); all
          # four set => client-credentials; a partial set fails loud in-container.
          STITCH_AUTH_CLIENT_ID: ${{ inputs.stitch-auth-client-id }}
          STITCH_AUTH_CLIENT_SECRET: ${{ secrets.stitch-auth-client-secret }}
          STITCH_AUTH_AUDIENCE: ${{ inputs.stitch-auth-audience }}
          STITCH_AUTH_ISSUER_URL: ${{ inputs.stitch-auth-issuer-url }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e LOG_LEVEL \
            -e API_BASE_URL \
            -e FAKER_POST_COUNT \
            -e RANDOM_SEED \
            -e SEED_SOURCE \
            -e NULL_PROBABILITY \
            -e STATIC_PAYLOAD_DIR \
            -e STITCH_AUTH_CLIENT_ID \
            -e STITCH_AUTH_CLIENT_SECRET \
            -e STITCH_AUTH_AUDIENCE \
            -e STITCH_AUTH_ISSUER_URL \
            -v "$GITHUB_WORKSPACE/deployments/seed/data:/mnt/data:ro" \
            "${{ inputs.full-image-name }}"


      - name: Write comment JSON
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/comment-json
          json_file="/tmp/comment-json/comment-json-seed.json"

          jq -n \
            --arg section "jobs" \
            --arg kind "seed_run" \
            --arg name "seed" \
            --arg job "seed" \
            --arg api_url '`${{ inputs.api-url }}`' \
            --arg image '`${{ inputs.full-image-name }}`' \
            --arg auth_mode '`m2m`' \
            '{
              "section": $section,
              "kind": $kind,
              "name": $name,
              "warnings": [],
              "data": {
                "job": $job,
                "api_url": $api_url,
                "image": $image,
                "auth_mode": $auth_mode
              }
            }' > "$json_file"

          jq empty "$json_file"
          cat "$json_file"

      - name: Upload comment JSON artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: comment-json-seed
          path: /tmp/comment-json/*.json
          if-no-files-found: error
