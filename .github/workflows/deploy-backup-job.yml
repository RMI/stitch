---
name: Deploy backup job

# Pull requests only build (and publish) the backup image, so a broken
# Dockerfile shows up before merge. The job itself is deployed from main or by
# manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths:
      - deployments/db-backup/**
      - .github/scripts/deploy_backup_job.sh
      - .github/workflows/deploy-backup-job.yml
  pull_request:
    paths:
      - deployments/db-backup/**
      - .github/scripts/deploy_backup_job.sh
      - .github/workflows/deploy-backup-job.yml

jobs:
  resolve-context:
    name: Resolve deployment context
    uses: ./.github/workflows/resolve-deployment-context.yml

  build-backup-image:
    name: Build and publish backup image
    needs: [resolve-context]
    uses: ./.github/workflows/build-and-push-Docker-image.yml
    secrets: inherit
    permissions:
      packages: write
      contents: read
    with:
      dockerfile: deployments/db-backup/Dockerfile
      image-name: ${{ github.event.repository.name }}-db-backup
      image-tag: ${{ needs.resolve-context.outputs.deployment-name }}

  deploy-backup-job:
    name: Deploy backup job (production)
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build-backup-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      JOB_NAME: stitch-backup-production
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
      LANE_BACKUP_IMAGE: ${{ needs.build-backup-image.outputs.digest-image-name }}
      LANE_PGHOST: ${{ vars.POSTGRES_HOST }}
      LANE_PGUSER: ${{ vars.POSTGRES_ADMIN_USER || 'postgres' }}
      LANE_BACKUP_ENV: production
      LANE_BACKUP_DATABASES: ${{ vars.BACKUP_DATABASES }}
      LANE_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
      LANE_BACKUP_IDENTITY_NAME: ${{ vars.BACKUP_IDENTITY_NAME || 'stitch-backup-prod' }}
      LANE_PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate lane config
        shell: bash
        run: |
          set -euo pipefail
          : "${LANE_BACKUP_IMAGE:?Missing the backup image digest from the build job}"
          : "${AZURE_RESOURCE_GROUP:?Missing required variable AZURE_RESOURCE_GROUP}"
          : "${AZURE_CONTAINER_APP_ENVIRONMENT:?Missing required variable AZURE_CONTAINER_APP_ENVIRONMENT}"
          : "${LANE_PGHOST:?Missing required variable POSTGRES_HOST}"
          : "${LANE_PGUSER:?Missing required variable POSTGRES_ADMIN_USER}"
          : "${LANE_BACKUP_DATABASES:?Missing required variable BACKUP_DATABASES}"
          : "${LANE_STORAGE_ACCOUNT:?Missing required variable BACKUP_STORAGE_ACCOUNT}"
          : "${LANE_PGPASSWORD:?Missing required secret PGPASSWORD}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension is available
        run: |
          az extension add --name containerapp --upgrade --allow-preview true

      - name: Deploy the backup job
        run: .github/scripts/deploy_backup_job.sh
