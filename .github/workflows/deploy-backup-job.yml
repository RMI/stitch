---
name: Deploy backup job

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deployments/db/jobs/backup-job.yaml
      - scripts/deploy_backup_job.sh
      - .github/workflows/deploy-backup-job.yml

jobs:
  deploy-backup-job:
    name: Deploy backup job (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [production]
    environment: ${{ matrix.lane }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
      LANE_PGHOST: ${{ vars.POSTGRES_HOST }}
      LANE_PGUSER: ${{ vars.POSTGRES_ADMIN_USER || 'postgres' }}
      LANE_BACKUP_DATABASES: ${{ vars.BACKUP_DATABASES }}
      LANE_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
      LANE_PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension is available
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Deploy the backup job
        run: scripts/deploy_backup_job.sh deploy ${{ matrix.lane }}
