on:
  workflow_call:
    inputs:
      deployment-lane:
        description: "Deployment lane and GitHub Environment name"
        required: true
        type: string
      full-image-name:
        description: "Full pushed image name including host/registry, name, and tag"
        required: true
        type: string
      container-app-name:
        description: "The name of the Azure Container App."
        required: true
        type: string
      target-port:
        description: "Port the application listens on"
        required: false
        default: 8000
        type: number
      deployment-label:
        description: "Short label for reporting"
        required: false
        default: "container-app"
        type: string
      environment-variables:
        description: "Whitespace-delimited KEY=value pairs"
        required: false
        default: ""
        type: string

    outputs:
      container-app-url:
        description: "HTTPS URL of the deployed Azure Container App"
        value: ${{ jobs.deploy-container-app.outputs.container-app-url }}
      container-app-fqdn:
        description: "Ingress FQDN of the deployed Azure Container App"
        value: ${{ jobs.deploy-container-app.outputs.container-app-fqdn }}

jobs:
  deploy-container-app:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-lane }}
    permissions:
      id-token: write
      contents: read
      packages: read
    timeout-minutes: 25
    outputs:
      container-app-url: ${{ steps.export-app-url.outputs.container-app-url }}
      container-app-fqdn: ${{ steps.export-app-url.outputs.container-app-fqdn }}
    steps:
      - name: Validate lane config
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing required variable AZURE_RESOURCE_GROUP}"
          : "${AZURE_CONTAINER_APP_ENVIRONMENT:?Missing required variable AZURE_CONTAINER_APP_ENVIRONMENT}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: echo "fullname=${{ inputs.full-image-name }}"

      - name: Assemble environment variables
        id: envvars
        shell: bash
        run: |
          set -euo pipefail
          envvars='${{ inputs.environment-variables }}'
          echo "environment-variables<<EOF" >> "$GITHUB_OUTPUT"
          echo "$envvars" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ inputs.full-image-name }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ inputs.container-app-name }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
          targetPort: ${{ inputs.target-port }}
          environmentVariables: ${{ steps.envvars.outputs.environment-variables }}
          ingress: "external"

      - name: Export application URL
        id: export-app-url
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          fqdn="$(
            az containerapp show \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv
          )"

          if [ -z "$fqdn" ]; then
            echo "Failed to resolve container app ingress FQDN" >&2
            exit 1
          fi

          echo "Resolved FQDN: $fqdn"
          echo "container-app-fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "container-app-url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Write comment JSON
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/comment-json
          json_file="/tmp/comment-json/comment-json-deploy-${{ inputs.deployment-label }}.json"

          jq -n \
            --arg section "deployments" \
            --arg kind "container_app" \
            --arg name "${{ inputs.deployment-label }}" \
            --arg service "${{ inputs.deployment-label }}" \
            --arg url "[open](${{ steps.export-app-url.outputs.container-app-url }})" \
            --arg fqdn '`${{ steps.export-app-url.outputs.container-app-fqdn }}`' \
            '{
              "section": $section,
              "kind": $kind,
              "name": $name,
              "warnings": [],
              "data": {
                "service": $service,
                "url": $url,
                "fqdn": $fqdn
              }
            }' > "$json_file"

          jq empty "$json_file"
          cat "$json_file"

      - name: Upload comment JSON artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: comment-json-deploy-${{ inputs.deployment-label }}
          path: /tmp/comment-json/*.json
          if-no-files-found: error
