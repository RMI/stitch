---
on:
  workflow_call:
    inputs:
      deployment-lane:
        description: "Deployment lane and GitHub Environment name"
        required: true
        type: string
      full-image-name:
        description: "Full pushed image name including host/registry, name, and digest"
        required: true
        type: string
      postgres-host:
        required: true
        type: string
      postgres-port:
        required: false
        default: "5432"
        type: string
      postgres-db:
        required: true
        type: string
      postgres-sslmode:
        required: false
        default: "require"
        type: string
    secrets:
      stitch-migrator-password:
        required: true

name: Run DB Migrations

jobs:
  run-db-migrations:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-lane }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25

    steps:
      - name: Validate lane secrets
        shell: bash
        env:
          STITCH_MIGRATOR_PASSWORD: ${{ secrets.stitch-migrator-password }}
        run: |
          set -euo pipefail
          : "${STITCH_MIGRATOR_PASSWORD:?Missing required secret STITCH_MIGRATOR_PASSWORD}"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull migrator image
        run: docker pull "${{ inputs.full-image-name }}"

      - name: Run DB migrations job
        env:
          LOG_LEVEL: info
          POSTGRES_HOST: ${{ inputs.postgres-host }}
          POSTGRES_PORT: ${{ inputs.postgres-port }}
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: stitch_migrator
          POSTGRES_PASSWORD: ${{ secrets.stitch-migrator-password }}
          PGSSLMODE: ${{ inputs.postgres-sslmode }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e LOG_LEVEL \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_DB \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD \
            -e PGSSLMODE \
            "${{ inputs.full-image-name }}" \
            alembic -c deployments/api/alembic.ini upgrade head

      - name: Write comment JSON
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/comment-json
          json_file="/tmp/comment-json/comment-json-db-migrations.json"

          jq -n \
            --arg section "jobs" \
            --arg kind "db_migrations" \
            --arg name "db-migrations" \
            --arg job "db-migrations" \
            --arg image '`${{ inputs.full-image-name }}`' \
            --arg postgres_db '`${{ inputs.postgres-db }}`' \
            '{
              "section": $section,
              "kind": $kind,
              "name": $name,
              "warnings": [],
              "data": {
                "job": $job,
                "image": $image,
                "postgres_db": $postgres_db
              }
            }' > "$json_file"

          jq empty "$json_file"
          cat "$json_file"

      - name: Upload comment JSON artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: comment-json-db-migrations
          path: /tmp/comment-json/*.json
          if-no-files-found: error
