---
on:
  workflow_call:
    inputs:
      max_lines:
        description: "Maximum lines changed (additions + deletions) allowed in a PR"
        type: number
        default: 600
      ignore:
        description: "Newline-delimited git glob pathspecs whose changes are not counted (e.g. **/uv.lock)"
        type: string
        default: ""

jobs:
  check:
    name: Check PR size
    # Only meaningful for pull requests. PRs whose source is a long-lived
    # branch are release promotions (production <- next) or backmerges
    # (main <- production): they aggregate already-reviewed work, so they are
    # exempt. Skipping here (rather than in the caller) keeps the check name
    # stable, and a skipped job still satisfies a required status check.
    if: >-
      github.event_name == 'pull_request'
      && !contains(fromJSON('["main", "next", "production"]'), github.head_ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the merge base with the target branch is available.
          fetch-depth: 0

      - name: Count changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_LINES: ${{ inputs.max_lines }}
          IGNORE: ${{ inputs.ignore }}
        run: |
          set -euo pipefail

          # Count everything, minus each ignore pattern (blank lines and
          # '#' comments in the ignore list are skipped).
          pathspecs=(.)
          ignored_list=""
          while IFS= read -r pattern; do
            pattern="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' <<< "$pattern")"
            if [ -z "$pattern" ] || [[ "$pattern" == \#* ]]; then
              continue
            fi
            pathspecs+=(":(glob,exclude)$pattern")
            ignored_list+="${ignored_list:+, }$pattern"
          done <<< "$IGNORE"

          # Three-dot diff: changes on the PR branch since it diverged from
          # the target, matching GitHub's "Files changed" view. Captured first
          # so a git failure fails the step instead of being hidden by a pipe.
          numstat="$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- "${pathspecs[@]}")"

          # numstat lines are "<added>\t<deleted>\t<path>". Binary files
          # report "-" for both and count as 0 lines, as on GitHub.
          per_file="$(awk -F '\t' 'NF >= 3 && $1 != "-" { print $1 + $2 "\t" $3 }' <<< "$numstat" | sort -rn)"
          total="$(awk -F '\t' '{ sum += $1 } END { print sum + 0 }' <<< "$per_file")"

          {
            echo "## PR size"
            echo
            echo "**$total** lines changed (additions + deletions). The limit is **$MAX_LINES**."
            echo
            if [ -n "$ignored_list" ]; then
              echo "Not counted: \`$ignored_list\`"
              echo
            fi
            if [ -n "$per_file" ]; then
              echo "| Lines | Largest files |"
              echo "| ---: | --- |"
              head -n 10 <<< "$per_file" | awk -F '\t' '{ printf "| %s | `%s` |\n", $1, $2 }'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$total" -gt "$MAX_LINES" ]; then
            not_counted=""
            if [ -n "$ignored_list" ]; then
              not_counted=" (not counting $ignored_list)"
            fi
            echo "::error title=PR too large::This PR changes $total lines; the limit is $MAX_LINES$not_counted. Split it into smaller PRs that can be reviewed independently. The job summary lists the largest files."
            exit 1
          fi

          echo "PR size OK: $total of $MAX_LINES lines changed."
