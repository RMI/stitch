---
on:
  workflow_call:
    inputs:
      max_lines:
        description: "Maximum lines changed (additions + deletions) allowed in a PR"
        type: number
        default: 600
      ignore:
        description: "Newline-delimited git glob pathspecs whose changes are not counted (e.g. **/uv.lock)"
        type: string
        default: ""
      exempt_head_branches:
        # JSON rather than newline-delimited so the job-level `if:` can test
        # it: expressions have fromJSON() but no way to split a string.
        description: 'JSON array of source branches in this repo whose PRs skip the check (e.g. ["main", "production"])'
        type: string
        default: "[]"

jobs:
  check:
    name: Check PR size
    # Only meaningful for pull requests. PRs from an exempt source branch
    # skip the check. A fork's branch of the same name is just a
    # contributor's branch, so the exemption only applies to same-repo PRs.
    # Skipping here (rather than in the caller) keeps the check name stable,
    # and a skipped job still satisfies a required status check.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON(inputs.exempt_head_branches), github.head_ref))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the merge base with the target branch is available.
          fetch-depth: 0

      - name: Count changed lines
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_LINES: ${{ inputs.max_lines }}
          IGNORE: ${{ inputs.ignore }}
        run: |
          set -euo pipefail

          # Count everything, minus the ignore list.
          pathspecs=(.)
          ignored_list=""
          while read -r pattern; do
            if [ -n "$pattern" ]; then
              pathspecs+=(":(glob,exclude)$pattern")
              ignored_list+="${ignored_list:+, }$pattern"
            fi
          done <<< "$IGNORE"

          # Three-dot diff: changes on the PR branch since it diverged from
          # the target, matching GitHub's "Files changed" view.
          range="origin/$BASE_REF...$HEAD_SHA"

          # Per-file breakdown for the log, so authors can see where the lines are.
          git diff --stat=200 "$range" -- "${pathspecs[@]}"

          # numstat lines are "<added> <deleted> <path>";
          # binary files report "-" for both and count as 0 lines, as on GitHub.
          numstat="$(git diff --numstat "$range" -- "${pathspecs[@]}")"
          total="$(awk '$1 != "-" { sum += $1 + $2 } END { print sum + 0 }' <<< "$numstat")"

          if [ "$total" -gt "$MAX_LINES" ]; then
            not_counted=""
            if [ -n "$ignored_list" ]; then
              not_counted=" (not counting $ignored_list)"
            fi
            echo "::error title=PR too large::This PR changes $total lines; the limit is $MAX_LINES$not_counted."
            exit 1
          fi

          echo "PR size OK: $total of $MAX_LINES lines changed."
