on:
  workflow_call:

jobs:
  alembic-check:
    name: "alembic check (migrations in sync)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up example Env file
        run: cp env.example .env

      - name: Check migrations are in sync with models
        run: make alembic-check
