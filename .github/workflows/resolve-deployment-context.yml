name: Resolve deployment context

on:
  workflow_call:
    outputs:
      deployment-lane:
        description: Deployment lane and GitHub Environment name
        value: ${{ jobs.resolve-context.outputs.deployment-lane }}
      deployment-name:
        description: Concrete deployment target name
        value: ${{ jobs.resolve-context.outputs.deployment-name }}

jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      deployment-lane: ${{ steps.resolve.outputs.deployment-lane }}
      deployment-name: ${{ steps.resolve.outputs.deployment-name }}
    steps:
      - name: Resolve lane and deployment name
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          normalize_name() {
            local raw="$1"
            echo "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g'
          }

          deployment_lane=""
          deployment_name=""

          case "$EVENT_NAME" in
            push|workflow_dispatch)
              case "$REF_NAME" in
                main)
                  deployment_lane="development"
                  deployment_name="main"
                  ;;
                production)
                  deployment_lane="dress-rehearsal"
                  deployment_name="dress-rehearsal"
                  ;;
                *)
                  echo "Unsupported push/dispatch target: $REF_NAME" >&2
                  exit 1
                  ;;
              esac
              ;;
            pull_request)
              # Zero-padded PR token, shared by both PR paths so names are uniform and
              # sort together in the Azure portal (e.g. pr0042, pr0200, pr12345).
              pr_token="pr$(printf '%04d' "$PR_NUMBER")"
              if [[ "$BASE_REF" == "production" || "$HEAD_REF" == demo/* ]]; then
                deployment_lane="staging"
                # Staging/demo names carry a readable branch tag. The PR number already
                # guarantees uniqueness; the hash lets a truncated tag be traced back to
                # its branch. Size the whole name to <=27 chars so appending the longest
                # container-app suffix ("-api"/"-llm"/"-etl", 4 chars) stays under Azure's
                # 32-char limit. Deriving the hash from the branch (not the commit/run)
                # keeps the name stable across every push to the same PR.
                branch="$(normalize_name "$HEAD_REF")"
                name_hash="$(printf '%s' "$branch" | sha256sum | cut -c1-4)"
                prefix="${pr_token}-"
                suffix="-${name_hash}"
                tag_budget=$(( 27 - ${#prefix} - ${#suffix} ))
                tag="$(printf '%s' "$branch" | cut -c1-"$tag_budget" | sed -E 's/-+$//')"
                deployment_name="${prefix}${tag}${suffix}"
              else
                deployment_lane="development"
                deployment_name="$pr_token"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            echo "deployment-lane=$deployment_lane"
            echo "deployment-name=$deployment_name"
          } >> "$GITHUB_OUTPUT"
